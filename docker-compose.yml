services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taxi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taxi_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin
      APP_JWT_SECRET: the-secret-key-is-32-characters-123
    depends_on:
      - postgres
      - rabbitmq
      - redis

  trip-service:
    build: ./trip-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taxi_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin
      APP_JWT_SECRET: the-secret-key-is-32-characters-123
      TRIP_TARIFF_PER_KM: 50
    depends_on:
      - postgres
      - rabbitmq
      - user-service

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taxi_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin
      APP_JWT_SECRET: the-secret-key-is-32-characters-123
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres_data:
